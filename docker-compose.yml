services:
  app:
    build:
      context: .
      args:
        # Optional — only set BASE_PATH when deploying under a sub-path via a reverse proxy.
        # Leave unset (or empty) when serving the app directly on a port.
        - BASE_PATH=${BASE_PATH:-}
    container_name: strawdmin
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - SECURE_COOKIES=${SECURE_COOKIES}
      # Legacy — only needed when migrating from a single-connection setup.
      # Strawdmin imports these as a "Default" connection on first start.
      # Once imported you can manage all connections from the UI and remove them.
      - DB_TYPE=${DB_TYPE}
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING}
    volumes:
      # Persistent data directory — REQUIRED to survive container restarts and upgrades.
      # Contains:
      #   app.db          — internal SQLite database (users, database connections,
      #                     FK display settings, field encryption settings,
      #                     column view preferences, access policies)
      #   backups/        — JSON backup files created from the Backups page
      - ./data:/app/data
    restart: unless-stopped

# ── Sub-path deployment (optional) ────────────────────────────────────────────
# Only needed when a reverse proxy serves the app under a sub-path (e.g. /strawdmin).
# Skip this entirely if the app is accessed directly on its port.
#
# Set BASE_PATH in .env and rebuild the image:
#   BASE_PATH=/services/strawdmin   (in .env)
#   docker compose up --build
#
# Forward the full path to the app — do NOT strip the prefix.
# Next.js handles the basePath internally. One nginx location is enough:
#
#   location /services/strawdmin {
#       proxy_pass http://strawdmin:3000;
#       proxy_set_header Host $http_host;
#       proxy_set_header X-Real-IP $remote_addr;
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#   }

